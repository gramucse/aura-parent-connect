
<!doctype html><html><head><meta charset="utf-8"><title>Upload Result</title>
<style>body{font-family:Arial;background:#f4f6f8}.box{max-width:850px;margin:40px auto;background:#fff;padding:24px;border-radius:12px}
.stats{display:flex;gap:12px}.stat{background:#f9fafb;padding:16px;border-radius:10px}.btn{display:inline-block;margin-top:16px;background:#111827;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none}</style></head>
<body><div class="box"><h1>CSV Upload Result</h1><div class="stats"><div class="stat"><b>{{inserted}}</b><br>Inserted</div>
<div class="stat"><b>{{updated}}</b><br>Updated</div><div class="stat"><b>{{rejected}}</b><br>Rejected</div></div>
{% if errors %}<h3>Issues</h3>{% for e in errors %}<p>{{e}}</p>{% endfor %}{% endif %}
<a class="btn" href="/students?admin_key={{admin_key}}">Back to Students</a></div></body></html>
